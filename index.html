<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İKY Vaka Arşivi</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f2933;--muted:#5f6b76;--line:#e3ded4;--accent:#0f6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#15191c;--card:#1f2529;--ink:#eceff1;--muted:#a3aeb7;--line:#343c42;--accent:#5cc4c0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
a.case{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit}
a.case:active{border-color:var(--accent)}
.w{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.t{font-weight:650}
.d{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>İKY Vaka Arşivi</h1>
<p class="sub">Eğitim ve Geliştirme dersi · Yüksek lisans</p>

<!-- Her hafta yeni bir <a class="case"> bloğu ekleyin (en yeni en üstte) -->
<a class="case" href="ogrenme-kuramlari/">
  <div class="w">Öğrenme Kuramları</div>
  <div class="t">Akdeniz Market: Eğitim Neden Tutmadı?</div>
  <div class="d">Davranışçı, bilişsel ve sosyal öğrenme · 2 kişilik grup etkinliği</div>
</a>

</main>
</body>
</html>
